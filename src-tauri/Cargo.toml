[package]
name = "idiot-lora-builder"
version = "0.7.0"
description = "Idiot LoRa Builder - Prepare image datasets for AI model training"
authors = ["PromptWaffle"]
license = "MIT"
repository = "https://github.com/Fablestarexpanse/Idiot-Lora-Builder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kamadak-exif = "0.6"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "time"] }
futures = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
once_cell = "1.19"
# load-dynamic: loads onnxruntime.dll at runtime (downloaded by models.rs) instead of
# static-linking pyke's prebuilt binaries, which require a newer MSVC STL than many
# toolchains have (unresolved __std_find_first_of_trivial_pos_* at link time).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
rayon = "1.10"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
